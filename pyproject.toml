[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-knock-gmrt"
version = "1.0.0"
description = "CLI tool to create GMRT observation reminders"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "GMRT Community"}
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
knock-knock = "knock_knock.cli:main"

[project.urls]
Homepage = "https://github.com/arpan-52/knock-knock"
